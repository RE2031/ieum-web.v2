<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 · 자람새</title>
<link rel="stylesheet" href="theme.css">
<style>
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4%;
    color: var(--text);
  }
  .signup-card{
    width: 92%;
    max-width: 420px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 8% 32px;
  }
  .signup-title{
    margin: 0 0 22px;
    text-align: center;
    font-size: 1.4rem;
    font-weight: 800;
  }

  .oauth-list{ display: flex; flex-direction: column; gap: 10px; }
  .oauth-btn{
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    font-size: .92rem;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid transparent;
    font-family: inherit;
  }
  .oauth-btn.kakao{ background: #fee500; color: #191919; }
  .oauth-btn.naver{ background: #03c75a; color: #fff; }
  .oauth-btn.google{ background: #fff; color: #111; border-color: var(--border); }
  .oauth-notice{
    display: none;
    margin-top: 10px;
    font-size: .8rem;
    color: var(--text-sub);
    text-align: center;
  }
  .oauth-notice.show{ display: block; }

  .divider{
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 22px 0;
    font-size: .8rem;
    color: var(--text-sub);
  }
  .divider::before, .divider::after{
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  form{ display: flex; flex-direction: column; gap: 12px; }
  label{ font-size: .82rem; font-weight: 600; color: #374151; margin-bottom: -6px; }
  input[type="text"], input[type="password"]{
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: #f9fafb;
    font-size: .92rem;
    font-family: inherit;
    color: var(--text);
    outline: none;
  }
  input:focus{ border-color: var(--brand); background: #fff; }

  .error-msg{
    display: none;
    font-size: .8rem;
    color: #b91c1c;
    background: #fef2f2;
    padding: 8px 12px;
    border-radius: 10px;
  }
  .error-msg.show{ display: block; }

  .submit-btn{
    margin-top: 6px;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: var(--brand);
    color: #fff;
    font-size: .95rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .submit-btn:hover{ background: var(--brand-dark); }

  .login-link{
    margin-top: 22px;
    text-align: center;
    font-size: .84rem;
    color: var(--text-sub);
  }
  .login-link a{ color: var(--brand); font-weight: 700; text-decoration: none; }
  .login-link a:hover{ text-decoration: underline; }
</style>
</head>
<body>

<div class="signup-card">
  <h1 class="signup-title">회원가입</h1>

  <div class="oauth-list">
    <button type="button" class="oauth-btn kakao" data-provider="kakao">카카오톡으로 시작하기</button>
    <button type="button" class="oauth-btn naver" data-provider="naver">네이버로 시작하기</button>
    <button type="button" class="oauth-btn google" data-provider="google">구글로 시작하기</button>
  </div>
  <div class="oauth-notice" id="oauthNotice">소셜 로그인은 준비 중이에요. 아이디로 가입해 주세요.</div>

  <div class="divider">또는 아이디로 가입</div>

  <form id="signupForm" novalidate>
    <div class="error-msg" id="errorMsg"></div>

    <label for="signupId">아이디</label>
    <input type="text" id="signupId" autocomplete="username" placeholder="아이디를 입력하세요">

    <label for="signupName">이름 또는 닉네임</label>
    <input type="text" id="signupName" autocomplete="nickname" placeholder="이웃에게 보일 이름을 입력하세요">

    <label for="signupPw">비밀번호</label>
    <input type="password" id="signupPw" autocomplete="new-password" placeholder="비밀번호 (4자리 이상)">

    <label for="signupPwConfirm">비밀번호 확인</label>
    <input type="password" id="signupPwConfirm" autocomplete="new-password" placeholder="비밀번호를 한 번 더 입력하세요">

    <button type="submit" class="submit-btn">회원가입</button>
  </form>

  <div class="login-link">
    이미 계정이 있으신가요? <a href="login.html">로그인</a>
  </div>
</div>

<script src="auth.js"></script>
<script>
  document.querySelectorAll('.oauth-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.getElementById('oauthNotice').classList.add('show');
    });
  });

  document.getElementById('signupForm').addEventListener('submit', function(e){
    e.preventDefault();
    const id = document.getElementById('signupId').value.trim();
    const name = document.getElementById('signupName').value.trim();
    const pw = document.getElementById('signupPw').value;
    const pwConfirm = document.getElementById('signupPwConfirm').value;
    const errorEl = document.getElementById('errorMsg');

    let message = '';
    if (!id || !name || !pw || !pwConfirm) {
      message = '모든 항목을 입력해주세요.';
    } else if (pw.length < 4) {
      message = '비밀번호는 4자리 이상이어야 해요.';
    } else if (pw !== pwConfirm) {
      message = '비밀번호가 일치하지 않아요.';
    }

    if (message) {
      errorEl.textContent = message;
      errorEl.classList.add('show');
      return;
    }

    // 데모: 서버 연동 전이라 localStorage에 로그인 상태만 저장 (login.html과 동일한 역할 규칙)
    const lowerId = id.toLowerCase();
    const role = lowerId.startsWith('admin') ? 'admin' : lowerId.startsWith('teacher') ? 'teacher' : 'parent';
    setAuth(id, role);
    location.href = 'index.html';
  });
</script>

</body>
</html>
