<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 · 자람새</title>
<link rel="stylesheet" href="theme.css">
<style>
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    color: var(--text);
  }
  .signup-card{
    width: 100%;
    max-width: 420px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 32px 36px;
  }
  .signup-title{
    margin: 0 0 22px;
    text-align: center;
    font-size: 1.4rem;
    font-weight: 800;
  }

  .oauth-list{ display: flex; flex-direction: column; gap: 10px; }
  .oauth-btn{
    position: relative;
    width: 100%;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 0 16px;
    border-radius: 12px;
    font-size: .95rem;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
    border: 1px solid transparent;
    font-family: inherit;
  }
  .oauth-btn svg{ width: 20px; height: 20px; flex: 0 0 auto; }
  .oauth-btn .oauth-icon{ position: absolute; left: 16px; top: 50%; transform: translateY(-50%); }
  .oauth-btn.kakao{ background: #fee500; color: #000000; }
  .oauth-btn.naver{ background: #03a94d; color: #fff; }
  .oauth-btn.google{ background: #fff; color: #1f1f1f; border-color: #747775; }
  .oauth-btn:hover{ filter: brightness(0.97); }
  .oauth-notice{
    display: none;
    margin-top: 10px;
    font-size: .8rem;
    color: var(--text-sub);
    text-align: center;
  }
  .oauth-notice.show{ display: block; }

  .divider{
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 22px 0;
    font-size: .8rem;
    color: var(--text-sub);
  }
  .divider::before, .divider::after{
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  form{ display: flex; flex-direction: column; gap: 12px; }
  label{ font-size: .82rem; font-weight: 600; color: #374151; margin-bottom: -6px; }
  input[type="text"], input[type="password"]{
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: #f9fafb;
    font-size: .92rem;
    font-family: inherit;
    color: var(--text);
    outline: none;
  }
  input:focus{ border-color: var(--brand); background: #fff; }

  .error-msg{
    display: none;
    font-size: .8rem;
    color: #b91c1c;
    background: #fef2f2;
    padding: 8px 12px;
    border-radius: 10px;
  }
  .error-msg.show{ display: block; }

  .submit-btn{
    margin-top: 6px;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: var(--brand);
    color: #fff;
    font-size: .95rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .submit-btn:hover{ background: var(--brand-dark); }

  .login-link{
    margin-top: 22px;
    text-align: center;
    font-size: .84rem;
    color: var(--text-sub);
  }
  .login-link a{ color: var(--brand); font-weight: 700; text-decoration: none; }
  .login-link a:hover{ text-decoration: underline; }
</style>
</head>
<body>

<div class="signup-card">
  <h1 class="signup-title">회원가입</h1>

  <div class="oauth-list">
    <button type="button" class="oauth-btn kakao" data-provider="kakao"><svg class="oauth-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#000" d="M12 3C6.48 3 2 6.58 2 11c0 2.85 1.87 5.35 4.68 6.77-.2.74-.73 2.65-.84 3.06-.13.52.19.51.4.37.17-.11 2.66-1.8 3.73-2.53.66.1 1.34.15 2.03.15 5.52 0 10-3.58 10-8S17.52 3 12 3z"/></svg>카카오로 시작하기</button>
    <button type="button" class="oauth-btn naver" data-provider="naver"><svg class="oauth-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M4 4h5.2l5.6 8.2V4H20v16h-5.2L9.2 11.8V20H4z"/></svg>네이버로 시작하기</button>
    <button type="button" class="oauth-btn google" data-provider="google"><svg class="oauth-icon" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>Google 계정으로 시작하기</button>
  </div>
  <div class="oauth-notice" id="oauthNotice">소셜 로그인은 준비 중이에요. 아이디로 가입해 주세요.</div>

  <div class="divider">또는 아이디로 가입</div>

  <form id="signupForm" novalidate>
    <div class="error-msg" id="errorMsg"></div>

    <label for="signupId">아이디</label>
    <input type="text" id="signupId" autocomplete="username" placeholder="아이디를 입력하세요">

    <label for="signupName">이름 또는 닉네임</label>
    <input type="text" id="signupName" autocomplete="nickname" placeholder="이웃에게 보일 이름을 입력하세요">

    <label for="signupPw">비밀번호</label>
    <input type="password" id="signupPw" autocomplete="new-password" placeholder="비밀번호 (4자리 이상)">

    <label for="signupPwConfirm">비밀번호 확인</label>
    <input type="password" id="signupPwConfirm" autocomplete="new-password" placeholder="비밀번호를 한 번 더 입력하세요">

    <button type="submit" class="submit-btn">회원가입</button>
  </form>

  <div class="login-link">
    이미 계정이 있으신가요? <a href="login.html">로그인</a>
  </div>
</div>

<script src="auth.js"></script>
<script>
  document.querySelectorAll('.oauth-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.getElementById('oauthNotice').classList.add('show');
    });
  });

  document.getElementById('signupForm').addEventListener('submit', function(e){
    e.preventDefault();
    const id = document.getElementById('signupId').value.trim();
    const name = document.getElementById('signupName').value.trim();
    const pw = document.getElementById('signupPw').value;
    const pwConfirm = document.getElementById('signupPwConfirm').value;
    const errorEl = document.getElementById('errorMsg');

    let message = '';
    if (!id || !name || !pw || !pwConfirm) {
      message = '모든 항목을 입력해주세요.';
    } else if (pw.length < 4) {
      message = '비밀번호는 4자리 이상이어야 해요.';
    } else if (pw !== pwConfirm) {
      message = '비밀번호가 일치하지 않아요.';
    }

    if (message) {
      errorEl.textContent = message;
      errorEl.classList.add('show');
      return;
    }

    // 데모: 서버 연동 전이라 localStorage에 로그인 상태만 저장 (login.html과 동일한 역할 규칙)
    const lowerId = id.toLowerCase();
    const role = lowerId.startsWith('admin') ? 'admin' : lowerId.startsWith('teacher') ? 'teacher' : 'parent';
    setAuth(id, role);
    location.href = 'index.html';
  });
</script>

</body>
</html>
