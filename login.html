<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자람새 로그인</title>
<style>
  :root{
    --bg: #eef1fb;
    --card: #ffffff;
    --blue: #6c8ef5;
    --blue-dark: #5578e0;
    --blue-light: #eaf0ff;
    --text: #1f2430;
    --text-sub: #8a8fa3;
    --border: #edeff5;
    --danger: #e0556c;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }

  .login-card{
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border-radius: 20px;
    padding: 40px 34px;
    box-shadow: 0 4px 24px rgba(20,30,60,.08);
  }

  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    margin-bottom: 28px;
  }
  .brand svg{ width:44px; height:44px; }
  .brand span{ font-size: 1.4rem; font-weight:700; }
  .brand small{ color: var(--text-sub); font-size: .8rem; }

  form{ display:flex; flex-direction:column; gap: 14px; }

  label{ font-size: .82rem; font-weight:600; color:#454b5c; margin-bottom: -8px; }

  input[type="text"], input[type="password"]{
    width:100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: #f8f9fd;
    font-size: .92rem;
    color: var(--text);
    outline: none;
    transition: border-color .15s ease, background .15s ease;
  }
  input[type="text"]:focus, input[type="password"]:focus{
    border-color: var(--blue);
    background: #fff;
  }

  .error-msg{
    display:none;
    font-size: .8rem;
    color: var(--danger);
    background: #fdecee;
    padding: 8px 12px;
    border-radius: 10px;
  }
  .error-msg.show{ display:block; }

  button[type="submit"]{
    margin-top: 6px;
    padding: 13px;
    border:none;
    border-radius: 12px;
    background: var(--blue);
    color:#fff;
    font-size: .95rem;
    font-weight:700;
    cursor:pointer;
    transition: background .15s ease;
  }
  button[type="submit"]:hover{ background: var(--blue-dark); }

  .demo-hint{
    margin-top: 22px;
    padding: 14px 16px;
    background: var(--blue-light);
    border-radius: 12px;
    font-size: .78rem;
    color: #4a5578;
    line-height:1.6;
  }
  .demo-hint strong{ color: var(--blue-dark); }
</style>
</head>
<body>

  <div class="login-card">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="#6c8ef5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 8c0 3-2.5 4-5 4l-1 6h-3l-1-4c-3 0-6-2-6-6 0-1 .3-2 1-3 .5 1 1.5 1.5 2.5 1.5C8 4 10 3 12 3c1 0 2 .3 2.8.9C15.5 3.3 16.7 3 18 3c0 1.2-.4 2.2-1.2 3 1.4.5 2.2 1.2 3.2 2z"/>
        <circle cx="16.5" cy="7.5" r=".6" fill="#6c8ef5"/>
      </svg>
      <span>자람새</span>
      <small>소중한 성장, 그 첫걸음</small>
    </div>

    <form id="loginForm" novalidate>
      <div class="error-msg" id="errorMsg"></div>

      <label for="loginId">아이디</label>
      <input type="text" id="loginId" autocomplete="username" placeholder="아이디를 입력하세요">

      <label for="loginPw">비밀번호</label>
      <input type="password" id="loginPw" autocomplete="current-password" placeholder="비밀번호를 입력하세요">

      <button type="submit">로그인</button>
      <div style="margin-top:18px; padding-top:16px; border-top:1px dashed #e2e8f0; text-align:center;">
        <div style="font-size:.82rem; color:#64748b; margin-bottom:8px;">
          처음 방문하셨나요? 안심 서약과 함께 시작하세요
        </div>
        <a href="signup.html" style="display:block; width:100%; padding:11px; background:#eef3ff; color:var(--blue-dark); border:1.5px solid #c7d2fe; border-radius:10px; font-weight:800; text-decoration:none; font-size:.9rem; transition:all .15s ease; box-sizing:border-box;">
          🌱 신규 회원가입 &amp; 클린 안심 서약하기 →
        </a>
      </div>
    </form>

    <div class="demo-hint">
      <strong>데모 안내</strong><br>
      서버 연동 전 화면 시안이라 아무 비밀번호나 입력해도 로그인돼요.<br>
      아이디가 <strong>teacher</strong>로 시작하면 교사 계정으로 인식되어
      홈 화면에 <strong>교사용 서재</strong> 메뉴가 나타납니다. (예: teacher01)<br>
      아이디가 <strong>admin</strong>으로 시작하면 관리자 계정으로 인식되어
      <strong>신고 검토</strong> 메뉴가 나타납니다. (예: admin01)<br>
      그 외 아이디는 학부모 계정으로 로그인됩니다. (예: parent01)
    </div>
  </div>

<script src="auth.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    const id = document.getElementById('loginId').value.trim();
    const pw = document.getElementById('loginPw').value;
    const errorEl = document.getElementById('errorMsg');

    if(!id || !pw){
      errorEl.textContent = '아이디와 비밀번호를 모두 입력해주세요.';
      errorEl.classList.add('show');
      return;
    }

    const lowerId = id.toLowerCase();
    const role = lowerId.startsWith('admin') ? 'admin' : lowerId.startsWith('teacher') ? 'teacher' : 'parent';
    setAuth(id, role);
    location.href = 'index.html';
  });
</script>

</body>
</html>
