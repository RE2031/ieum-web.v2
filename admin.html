<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신고 검토 · 자람새</title>
<style>
  :root{
    --bg: #eef1fb;
    --card: #ffffff;
    --blue: #6c8ef5;
    --blue-light: #eaf0ff;
    --text: #1f2430;
    --text-sub: #8a8fa3;
    --border: #edeff5;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  header{
    display:flex; align-items:center; justify-content:space-between;
    background:#fff; padding: 14px 32px; border-bottom: 1px solid var(--border);
    position: sticky; top:0; z-index: 10;
  }
  .logo{ display:flex; align-items:center; gap:10px; font-size: 1.3rem; font-weight:700; text-decoration:none; color: inherit; }
  .logo svg{ width:30px; height:30px; }
  .back-link{ font-size: .85rem; color: var(--text-sub); text-decoration:none; }
  .back-link:hover{ color: var(--text); }

  .wrap{ max-width: 820px; margin: 28px auto; padding: 0 24px; }

  .page-banner{
    display:flex; align-items:center; gap:14px;
    background: linear-gradient(135deg, #ffe9ec, #fff);
    border: 1px solid #ffc9d1;
    border-radius: 18px;
    padding: 20px 24px;
    margin-bottom: 22px;
  }
  .page-banner .icon{
    width:48px; height:48px; border-radius: 12px;
    background: #ffe9ec;
    display:flex; align-items:center; justify-content:center; flex: 0 0 auto;
  }
  .page-banner .icon svg{ width:24px; height:24px; stroke: #e0556c; }
  .page-banner h1{ margin: 0 0 4px; font-size: 1.2rem; }
  .page-banner p{ margin:0; font-size: .84rem; color: var(--text-sub); }

  .queue-item{
    background: var(--card);
    border-radius: 16px;
    padding: 20px 22px;
    margin-bottom: 14px;
    box-shadow: 0 1px 3px rgba(20,30,60,.04);
  }
  .queue-item .cat-tag{
    display:inline-block;
    font-size: .7rem; font-weight:700;
    color: var(--blue); background: var(--blue-light);
    padding: 2px 8px; border-radius: 6px; margin-bottom: 8px;
  }
  .queue-item h3{ margin: 0 0 4px; font-size: 1rem; }
  .queue-item .meta{ font-size: .78rem; color: var(--text-sub); margin-bottom: 10px; }
  .queue-item .snippet{
    font-size: .86rem; color:#454b5c; line-height:1.5;
    margin: 0 0 12px;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .report-list{
    background:#fff8ec;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 14px;
    font-size: .8rem;
    color:#8a6a2a;
  }
  .report-list div{ padding: 2px 0; }
  .queue-actions{ display:flex; gap:10px; }
  .queue-actions button{
    flex:1;
    padding: 10px;
    border-radius: 10px;
    font-size: .85rem;
    font-weight:700;
    border:none;
    cursor:pointer;
  }
  .confirm-btn{ background:#e0556c; color:#fff; }
  .confirm-btn:hover{ background:#c6455b; }
  .dismiss-btn{ background:#f1f2f7; color:#454b5c; }
  .dismiss-btn:hover{ background:#e7e8f0; }

  .empty-state{
    text-align:center;
    padding: 60px 20px;
    color: var(--text-sub);
    background: var(--card);
    border-radius: 16px;
    font-size: .9rem;
  }

  @media (max-width: 480px){
    header{ padding: 12px 16px; }
    .wrap{ padding: 0 14px; }
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="#6c8ef5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 8c0 3-2.5 4-5 4l-1 6h-3l-1-4c-3 0-6-2-6-6 0-1 .3-2 1-3 .5 1 1.5 1.5 2.5 1.5C8 4 10 3 12 3c1 0 2 .3 2.8.9C15.5 3.3 16.7 3 18 3c0 1.2-.4 2.2-1.2 3 1.4.5 2.2 1.2 3.2 2z"/>
      <circle cx="16.5" cy="7.5" r=".6" fill="#6c8ef5"/>
    </svg>
    <span>자람새</span>
  </a>
  <a class="back-link" href="index.html">← 홈으로</a>
</header>

<div class="wrap">
  <div class="page-banner">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v18"/><path d="M5 4h11l-2.5 4L16 12H5"/></svg>
    </div>
    <div>
      <h1>신고 검토 큐</h1>
      <p>이웃 3명 이상이 신고해서 자동으로 임시 비공개된 글이에요. 확정하면 해당 작성자의 신뢰도가 깎이고, 문제없으면 비공개가 풀려요.</p>
    </div>
  </div>

  <div id="queueList"></div>

  <div style="margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--border);">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <h2 style="font-size:1.15rem; margin:0;">🛡️ 클린 안심 전자서약 접수 내역</h2>
      <a href="compliance-signature.html" style="font-size:.82rem; color:var(--blue); font-weight:700; text-decoration:none;">새 서약서 작성하기 ↗</a>
    </div>
    <div id="pledgeList"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="auth.js"></script>
<script>
  requireAdmin();

  function renderQueue() {
    const queue = getPendingReports();
    const listEl = document.getElementById('queueList');

    if (queue.length === 0) {
      listEl.innerHTML = `<div class="empty-state">검토 대기 중인 신고가 없어요.</div>`;
      return;
    }

    listEl.innerHTML = queue.map(p => {
      const meta = CATEGORIES[p.category];
      const reasons = (p.reports || []).map(r => `<div>· ${escapeHTML(r.by)} — ${escapeHTML(r.reason)}</div>`).join('');
      return `
        <div class="queue-item" id="queue-${p.id}">
          <span class="cat-tag">${meta ? escapeHTML(meta.label) : p.category}</span>
          <h3>${escapeHTML(p.title)}</h3>
          <div class="meta">${escapeHTML(p.author)} · ${formatDate(p.date)}</div>
          <p class="snippet">${escapeHTML(p.content)}</p>
          <div class="report-list">
            <strong>신고 사유 (${(p.reports || []).length}건)</strong>
            ${reasons}
          </div>
          <div class="queue-actions">
            <button class="confirm-btn" data-id="${p.id}" data-action="confirm">위반 확정 (신뢰도 차감)</button>
            <button class="dismiss-btn" data-id="${p.id}" data-action="dismiss">문제없음 (비공개 해제)</button>
          </div>
        </div>
      `;
    }).join('');

    listEl.querySelectorAll('button[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        const action = btn.dataset.action;
        const post = resolveReport(id, action);
        if (action === 'confirm' && post) {
          adjustTrustScore(post.author, -15);
        }
        renderQueue();
      });
    });
  }

  function renderPledges() {
    const listEl = document.getElementById('pledgeList');
    if (!listEl) return;
    const pledges = JSON.parse(localStorage.getItem('ieum_pledges') || '[]');
    if (pledges.length === 0) {
      listEl.innerHTML = `<div class="empty-state" style="padding:30px;">접수된 전자서약 내역이 없습니다. (새로운 파트너/관리자 서약 시 자동 등록)</div>`;
      return;
    }
    listEl.innerHTML = pledges.map(pl => {
      const typeLabel = pl.type === 'partner' ? '광고·제휴 파트너 안심 서약' : (pl.type === 'manager' ? '운영진 윤리 서약' : '일반 회원 서약');
      const badgeColor = pl.type === 'partner' ? '#10b981' : (pl.type === 'manager' ? '#f59f00' : '#4c6ef5');
      return `
        <div class="queue-item" style="border-left: 4px solid ${badgeColor};">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <span style="font-size:.74rem; font-weight:800; color:${badgeColor};">${typeLabel}</span>
            <span style="font-size:.74rem; color:var(--text-sub);">${escapeHTML(pl.date || '')}</span>
          </div>
          <h3 style="margin:0 0 4px;">${escapeHTML(pl.name)} (${escapeHTML(pl.org)})</h3>
          <div style="font-size:.78rem; color:#64748b; font-family:monospace; margin-top:4px;">
            인증 해시: ${escapeHTML(pl.hash || '')}
          </div>
          <div style="font-size:.74rem; color:#059669; font-weight:700; margin-top:6px;">
            ✓ 형법 제314조/350조 및 표시광고법 준수 서약 완료
          </div>
        </div>
      `;
    }).join('');
  }

  renderQueue();
  renderPledges();
</script>

</body>
</html>
