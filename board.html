<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자람새</title>
<style>
  :root{
    --bg: #eef1fb;
    --card: #ffffff;
    --blue: #6c8ef5;
    --blue-dark: #5578e0;
    --blue-light: #eaf0ff;
    --text: #1f2430;
    --text-sub: #8a8fa3;
    --border: #edeff5;
    --img-bg: #e4e7f0;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#fff;
    padding: 14px 32px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top:0;
    z-index: 10;
  }
  .logo{
    display:flex; align-items:center; gap:10px;
    font-size: 1.3rem; font-weight:700;
    text-decoration:none; color: inherit;
  }
  .logo svg{ width:30px; height:30px; }

  .header-right{ display:flex; align-items:center; gap: 20px; }
  .back-link{ font-size: .85rem; color: var(--text-sub); text-decoration:none; }
  .back-link:hover{ color: var(--text); }

  .user-area{
    display:flex; align-items:center; gap:10px;
    padding-left: 20px; border-left: 1px solid var(--border);
  }
  .profile-link{ display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; }
  .user-area .avatar-sm{
    width:34px; height:34px; border-radius:50%;
    background: linear-gradient(135deg, #cfd8f6, #a9b8ea);
    flex: 0 0 auto;
  }
  .user-area .user-info{ display:flex; flex-direction:column; line-height:1.3; }
  .user-area .user-info strong{ font-size: .85rem; }
  .user-area .role-badge{
    font-size: .68rem; padding: 1px 7px; border-radius: 8px;
    background: var(--blue-light); color: var(--blue); font-weight:600; width: fit-content;
  }
  .user-area .logout-btn{
    background:none; border:none; font-size: .78rem; color: var(--text-sub);
    cursor:pointer; padding: 6px 4px;
  }
  .user-area .logout-btn:hover{ color: var(--text); }

  .wrap{ max-width: 860px; margin: 28px auto; padding: 0 24px; }

  .page-banner{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    background: var(--card);
    border-radius: 18px;
    padding: 20px 24px;
    margin-bottom: 22px;
    box-shadow: 0 1px 3px rgba(20,30,60,.04);
  }
  .page-banner .left{ display:flex; align-items:center; gap:14px; }
  .page-banner .icon{
    width:48px; height:48px; border-radius: 12px;
    background: var(--blue-light);
    display:flex; align-items:center; justify-content:center; flex: 0 0 auto;
  }
  .page-banner .icon svg{ width:24px; height:24px; stroke: var(--blue); }
  .page-banner h1{ margin: 0 0 4px; font-size: 1.2rem; }
  .page-banner p{ margin:0; font-size: .84rem; color: var(--text-sub); }

  .write-btn{
    flex: 0 0 auto;
    background: var(--blue);
    color:#fff;
    border:none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: .85rem;
    font-weight:700;
    cursor:pointer;
    text-decoration:none;
    display:inline-block;
  }
  .write-btn:hover{ background: var(--blue-dark); }

  .post-list{ display:flex; flex-direction:column; gap:14px; }
  .post-row{
    display:block;
    background: var(--card);
    border-radius: 16px;
    padding: 18px 20px;
    text-decoration:none;
    color: inherit;
    box-shadow: 0 1px 3px rgba(20,30,60,.04);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .post-row:hover{ transform: translateY(-1px); box-shadow: 0 4px 12px rgba(20,30,60,.08); }
  .post-row .row-head{
    display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px; flex-wrap:wrap;
  }
  .post-row h3{ margin:0; font-size: 1rem; }
  .post-row .meta{ font-size: .76rem; color: var(--text-sub); white-space:nowrap; }
  .post-row .snippet{
    margin:0;
    font-size: .86rem;
    color:#5b6072;
    line-height:1.5;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .post-row .row-stats{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:8px;
    flex-wrap:wrap;
  }
  .post-row .img-badge{
    display:inline-flex; align-items:center; gap:4px;
    font-size: .74rem;
    color: var(--blue);
    background: var(--blue-light);
    padding: 2px 8px;
    border-radius: 8px;
  }
  .img-badge svg{ width:13px; height:13px; stroke: var(--blue); }
  .post-row .stat{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size: .78rem;
    color: var(--text-sub);
  }
  .answer-badge{
    font-size: .74rem;
    font-weight:700;
    padding: 2px 8px;
    border-radius: 8px;
  }
  .answer-badge.answered{ color:#2f9e6e; background:#e3f7ee; }
  .answer-badge.pending{ color:#b9793a; background:#fdf1e2; }

  .feature-row{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 20px;
  }
  .feature-card{
    display:flex;
    align-items:center;
    gap:14px;
    background: var(--card);
    border-radius: 16px;
    padding: 18px 20px;
    text-decoration:none;
    color: inherit;
    box-shadow: 0 1px 3px rgba(20,30,60,.04);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .feature-card:hover{ transform: translateY(-1px); box-shadow: 0 4px 12px rgba(20,30,60,.08); }
  .feature-card .icon{
    width:44px; height:44px; border-radius: 12px;
    display:flex; align-items:center; justify-content:center; flex: 0 0 auto;
  }
  .feature-card .icon svg{ width:22px; height:22px; }
  .feature-card.menu-feature .icon{ background:#fff1e4; }
  .feature-card.menu-feature .icon svg{ stroke:#ff9f5a; }
  .feature-card.play-feature .icon{ background:#e7f8f2; }
  .feature-card.play-feature .icon svg{ stroke:#5ac8a8; }
  .feature-card strong{ display:block; font-size: .95rem; margin-bottom:2px; }
  .feature-card span{ display:block; font-size: .78rem; color: var(--text-sub); }

  @media (max-width: 600px){
    .feature-row{ grid-template-columns: 1fr; }
  }

  .empty-state{
    text-align:center;
    padding: 60px 20px;
    color: var(--text-sub);
    background: var(--card);
    border-radius: 16px;
    font-size: .9rem;
  }

  @media (max-width: 480px){
    header{ padding: 12px 16px; }
    .wrap{ padding: 0 14px; }
    .user-area .user-info{ display:none; }
    .page-banner{ flex-direction:column; align-items:flex-start; }
    .write-btn{ align-self: stretch; text-align:center; }
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="#6c8ef5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 8c0 3-2.5 4-5 4l-1 6h-3l-1-4c-3 0-6-2-6-6 0-1 .3-2 1-3 .5 1 1.5 1.5 2.5 1.5C8 4 10 3 12 3c1 0 2 .3 2.8.9C15.5 3.3 16.7 3 18 3c0 1.2-.4 2.2-1.2 3 1.4.5 2.2 1.2 3.2 2z"/>
      <circle cx="16.5" cy="7.5" r=".6" fill="#6c8ef5"/>
    </svg>
    <span>자람새</span>
  </a>
  <div class="header-right">
    <a class="back-link" href="index.html">← 홈으로</a>
    <div class="user-area">
      <a class="profile-link" href="profile.html">
        <div class="avatar-sm"></div>
        <div class="user-info">
          <strong id="userName">-</strong>
          <span class="role-badge" id="userRoleBadge">-</span>
        </div>
      </a>
      <button class="logout-btn" onclick="logout()">로그아웃</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="page-banner">
    <div class="left">
      <div class="icon" id="catIcon"></div>
      <div>
        <h1 id="catTitle">게시판</h1>
        <p id="catDesc"></p>
      </div>
    </div>
    <a class="write-btn" id="writeBtn" href="#">글쓰기</a>
  </div>

  <div class="feature-row" id="featureRow"></div>

  <div class="post-list" id="postList"></div>
</div>

<script src="data.js"></script>
<script src="auth.js"></script>
<script>
  const HEART_ICON_SM = '<svg viewBox="0 0 24 24" width="13" height="13" style="vertical-align:-2px" stroke="var(--blue)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.35-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 5c-2.5 4.65-9.5 9-9.5 9z"/></svg>';
  const COMMENT_ICON_SM = '<svg viewBox="0 0 24 24" width="13" height="13" style="vertical-align:-2px" fill="none" stroke="var(--blue)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.5 7.2L3 20l1.1-5A8 8 0 1 1 21 12z"/></svg>';

  const ICONS = {
    guide: '<path d="M3 11v2a2 2 0 0 0 2 2h1l2 5h2l-1.5-5H10l9 4V6l-9 4H6a2 2 0 0 0-2 2z"/><path d="M13 10v6"/>',
    growth: '<rect x="3" y="4" width="14" height="14" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="M4 15l4-4 3 3 3-4 3 4"/><rect x="7" y="7" width="14" height="14" rx="2"/>',
    edu: '<rect x="3" y="4" width="8" height="8" rx="1.5"/><rect x="13" y="4" width="8" height="8" rx="1.5"/><path d="M7 8h0M17 8h0"/><path d="M3 16h18"/>',
    expert: '<circle cx="12" cy="12" r="9"/><path d="M9.3 9a2.7 2.7 0 1 1 3.6 2.5c-.8.35-1.4 1-1.4 1.9v.3"/><circle cx="12" cy="16.8" r=".6" fill="currentColor" stroke="none"/>',
    share: '<path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  };

  const auth = requireAuth();
  if (auth) renderAuthUI(auth);

  const params = new URLSearchParams(location.search);
  const cat = params.get('cat');
  const meta = CATEGORIES[cat];

  if (!meta || !ICONS[cat]) {
    location.href = 'index.html';
  } else {
    document.title = `${meta.label} · 자람새`;
    document.getElementById('catTitle').textContent = meta.label;
    document.getElementById('catDesc').textContent = meta.desc;
    document.getElementById('catIcon').innerHTML =
      `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[cat]}</svg>`;
    document.getElementById('writeBtn').href = `write.html?cat=${cat}`;
    document.getElementById('writeBtn').textContent = cat === 'expert' ? '질문하기' : '글쓰기';

    if (cat === 'edu') {
      document.getElementById('featureRow').innerHTML = `
        <a class="feature-card menu-feature" href="dinner-menu.html">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13a8 8 0 0 1 16 0"/><path d="M4 13h16v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M9 13V9a1 1 0 0 1 2 0v4"/><path d="M13 13V7a1 1 0 0 1 2 0v6"/></svg></div>
          <div><strong>저녁 메뉴 추천</strong><span>월령/연령대별 저녁 메뉴 뽑아보기</span></div>
        </a>
        <a class="feature-card play-feature" href="play-recommend.html">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9h0M15 9h0"/><path d="M8 14c1.5 2 6.5 2 8 0"/></svg></div>
          <div><strong>놀이 추천</strong><span>연령대/실내외별 놀이 뽑아보기</span></div>
        </a>
      `;
    }

    const posts = getPostsByCategory(cat);
    const listEl = document.getElementById('postList');

    if (posts.length === 0) {
      listEl.innerHTML = `<div class="empty-state">아직 등록된 글이 없어요. 첫 글을 남겨보세요!</div>`;
    } else {
      listEl.innerHTML = posts.map(p => `
        <a class="post-row" href="post.html?cat=${cat}&id=${p.id}">
          <div class="row-head">
            <h3>${escapeHTML(p.title)}</h3>
            <span class="meta">${escapeHTML(p.author)}${trustBadgeHTML(p.author)} · ${formatDate(p.date)}</span>
          </div>
          <p class="snippet">${escapeHTML(p.content)}</p>
          <div class="row-stats">
            ${cat === 'expert' ? (p.expertAnswer
              ? `<span class="answer-badge answered">✓ ${escapeHTML(p.expertAnswer.expert)} 답변완료</span>`
              : `<span class="answer-badge pending">답변 대기중</span>`) : ''}
            ${p.images ? `<span class="img-badge">${PHOTO_ICON_SVG}사진 ${p.images}장</span>` : ''}
            <span class="stat">${HEART_ICON_SM} ${(p.likes || []).length}</span>
            <span class="stat">${COMMENT_ICON_SM} ${(p.comments || []).length}</span>
          </div>
        </a>
      `).join('');
    }
  }
</script>

</body>
</html>
